# 복사: cp config.example.toml config.toml

bind = "0.0.0.0:8083"
data_dir = "./data"
max_upload_mb = 512
max_concurrent_jobs = 1

session_secret = "change-me-session-secret"
encryption_secret = "change-me-encryption-secret"

# 개발만. 운영은 false.(로그인 인증 미적용)
skip_auth = false

# Oracle은 ODBC. Tibero는 JDBC(맥 포함). jar가 없으면 Maven에서 받는다.
