# Host `just build` must work on macOS and Linux.
# Cross-compilation uses `cross` via `just build-target TARGET`.
# Do not pin a musl linker here — that would break host builds.

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
