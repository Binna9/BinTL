# Host `just build` must work on macOS and Linux.
# Cross-compilation uses `cross` via `just build-target TARGET`.
# Do not pin a musl linker here — that would break host builds.

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

# windows-gnu 기본값은 libgcc/winpthread DLL이 옆에 있어야 한다.
# crt-static이면 bintl.exe 하나로 실행된다. odbc32.dll은 Windows 기본 구성.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]
