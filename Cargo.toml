[workspace]
resolver = "2"
members = ["crates/server", "crates/engine", "crates/jobs", "crates/storage", "crates/connectors"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "postgres",
    "mysql",
    "migrate",
    "macros",
    "chrono",
    "uuid",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
